  /forms/10182/{id}/download:
    get:
      summary: Download a watermarked copy of a submitted Notice of Disagreement
      tags:
      - Notice of Disagreements
      operationId: downloadNod
      security:
      - productionOauth:
        - veteran/NoticeOfDisagreements.read
        - representative/NoticeOfDisagreements.read
        - system/NoticeOfDisagreements.read
      - sandboxOauth:
        - veteran/NoticeOfDisagreements.read
        - representative/NoticeOfDisagreements.read
        - system/NoticeOfDisagreements.read
      - bearer_token: []
      description: "Returns a watermarked copy of a Notice of Disagreement PDF as submitted to the VA. PDFs are available\nwith the following caveats:\n\n1. The PDF download will become available only after after the Notice of Disagreement has progressed to\n   the 'submitted' state.\n2. The PDF will stop being available one week after the Notice of Disagreement has progressed to the\n   'completed' state. This is when the Veteran's personally identifying information is purged from our servers.\n\nThe 'icn' parameter is required when accessing this endpoint using an OAuth token with the 'representative/NoticeOfDisagreements.read' or 'system/NoticeOfDisagreements.read' scopes.\nRequests made with the 'veteran/NoticeOfDisagreements.read' scope may omit the 'icn' parameter.\n"
      parameters:
      - name: icn
        description: ICN of the Veteran associated with the Notice of Disagreement. Optional when using a veteran-scoped OAuth token. Required when using a representative- or system-scoped token.
        example: 1012832025V743496
        schema:
          type: string
          pattern: ^[0-9]{10}V[0-9]{6}$
          minLength: 17
          maxLength: 17
        in: query
        required: false
      - name: id
        in: path
        description: Notice of Disagreement ID
        schema:
          type: string
          format: uuid
        example: 44444444-5555-6666-7777-888888888888
        required: true
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: file
        '400':
          description: Missing 'icn' query parameter (with a system- or representative-scoped OAuth token)
          content:
            application/json:
              example:
                errors:
                - title: Missing parameter
                  detail: The 'icn' parameter is required with this request
                  code: '108'
                  status: '400'
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: Forbidden access (with a veteran-scoped OAuth token to an unowned Notice of Disagreement)
          content:
            application/json:
              example:
                errors:
                - title: Forbidden
                  detail: 'Invalid ''icn'' parameter: Veterans may access only their own records'
                  code: '403'
                  status: '403'
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: Not Found
          content:
            application/json:
              examples:
                Notice of Disagreement not found, or 'icn' parameter does not match the Notice of Disagreement's saved data:
                  value:
                    errors:
                    - title: Resource not found
                      detail: Notice of Disagreement with uuid 44444444-5555-6666-7777-888888888888 not found
                      code: '404'
                      status: '404'
              schema:
                $ref: '#/components/schemas/errorModel'
        '410':
          description: Personally identifying information gone
          content:
            application/json:
              example:
                errors:
                - code: '410'
                  detail: PDF for NoticeOfDisagreement with id 44444444-5555-6666-7777-888888888888 cannot be downloaded because the form data was deleted from the server after the PII retention period expired
                  status: '410'
                  title: PDF download expired
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: PDF not ready
          content:
            application/json:
              example:
                errors:
                - code: '422'
                  detail: PDF for NoticeOfDisagreement with id 44444444-5555-6666-7777-888888888888 cannot be downloaded yet because the appeal is still being submitted
                  status: '422'
                  title: PDF download not ready
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
              schema:
                $ref: '#/components/schemas/errorModel'
