  /nod_upload_path:
    put:
      summary: Accepts Notice of Disagreement Evidence Submission document upload.
      tags:
      - Notice of Disagreements
      operationId: putNoticeOfDisagreementEvidenceSubmission
      description: 'Accepts document metadata, document binary, and attachment binaries. Full URL, including

        query parameters, provided from POST `/*/evidence_submissions`.

        Please see the `documentUploadMetadata` schema for the required payload schema.


        ## Example Payload


        The following demonstrates a (redacted) multipart payload suitable for submitting to the PUT

        endpoint. Most programming languages should have provisions for assembling a multipart

        payload like this without having to do so manually.


        ```

        --17de1ed8f01442b2a2d7a93506314b76

        Content-Disposition: form-data; name="metadata"

        Content-Type: application/json


        {"veteranFirstName": "Jane",

        "veteranLastName": "Doe",

        "fileNumber": "012345678",

        "zipCode": "94402",

        "source": "Vets.gov",

        "docType": "316"

        "businessLine": "BVA"}

        --17de1ed8f01442b2a2d7a93506314b76

        Content-Disposition: form-data; name="content"

        Content-Type: application/pdf


        <Binary PDF contents>

        --17de1ed8f01442b2a2d7a93506314b76

        Content-Disposition: form-data; name="attachment1"

        Content-Type: application/pdf


        <Binary PDF attachment contents>

        --17de1ed8f01442b2a2d7a93506314b76--

        ```


        This PUT request would have an overall HTTP Content-Type header:


        ```

        Content-Type: multipart/form-data; boundary=17de1ed8f01442b2a2d7a93506314b76

        ```


        Note that the Content-Disposition parameter "name" in each part must be the expected values

        "metadata", "content", "attachment1"..."attachmentN"

        '
      security:
      - apikey: []
      parameters:
      - name: Content-MD5
        in: header
        description: Base64-encoded 128-bit MD5 digest of the message. Use for integrity control.
        schema:
          type: string
      responses:
        '200':
          description: Document upload staged
        '400':
          description: Document upload failed
          content:
            application/xml:
              schema:
                type: object
                description: Document upload failed
                xml:
                  name: Error
                properties:
                  Code:
                    type: string
                    description: Error code
                    example: Bad Digest
                  Message:
                    type: string
                    description: Error detail
                    example: A client error (InvalidDigest) occurred when calling the PutObject operation - The Content-MD5 you specified was invalid.
                  Resource:
                    type: string
                    description: Resource description
                    example: /example_path_here/6d8433c1-cd55-4c24-affd-f592287a7572.upload
                  RequestId:
                    type: string
                    description: Identifier for debug purposes
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
            application/xml:
              schema:
                $ref: '#/components/schemas/errorModel'
