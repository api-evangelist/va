  /forms/10182/validate:
    post:
      summary: Validates a POST request body against the JSON schema.
      tags:
      - Notice of Disagreements
      operationId: nodValidate
      description: Like the POST /forms/10182, but only does the validations <b>—does not submit anything.</b>
      security:
      - productionOauth:
        - veteran/NoticeOfDisagreements.write
        - representative/NoticeOfDisagreements.write
        - system/NoticeOfDisagreements.write
      - sandboxOauth:
        - veteran/NoticeOfDisagreements.write
        - representative/NoticeOfDisagreements.write
        - system/NoticeOfDisagreements.write
      - bearer_token: []
      parameters: []
      responses:
        '200':
          description: Info about a single Notice of Disagreement
          content:
            application/json:
              examples:
                minimum fields used:
                  value:
                    data:
                      type: noticeOfDisagreementValidation
                      attributes:
                        status: valid
                all fields used:
                  value:
                    data:
                      type: noticeOfDisagreementValidation
                      attributes:
                        status: valid
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - noticeOfDisagreementValidation
                      attributes:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - valid
        '400':
          description: Bad request
          content:
            application/json:
              examples:
                Not JSON object:
                  value:
                    errors:
                    - code: '109'
                      detail: The request body isn't a JSON object
                      status: '400'
                      title: Bad Request
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Error
          content:
            application/json:
              examples:
                Violates JSON schema:
                  value:
                    errors:
                    - title: Missing required fields
                      detail: One or more expected fields were not found
                      code: '145'
                      source:
                        pointer: /data/attributes
                      status: '422'
                      meta:
                        missing_fields:
                        - boardReviewOption
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        content:
