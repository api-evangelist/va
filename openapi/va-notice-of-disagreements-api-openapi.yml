  /notice_of_disagreements/validate:
    post:
      summary: Validates a POST request body against the JSON schema.
      tags:
      - Notice of Disagreements
      operationId: nodValidate
      description: Like the POST /notice_of_disagreements, but only does the validations <b>—does not submit anything.</b>
      security:
      - apikey: []
      parameters:
      - in: header
        name: X-VA-File-Number
        required: false
        description: Veteran's file number
        schema:
          $ref: '#/components/schemas/X-VA-File-Number'
      - in: header
        name: X-VA-ICN
        required: false
        description: Veteran's ICN
        example: 1013062086V794840
        schema:
          $ref: '#/components/schemas/X-VA-ICN'
      - in: header
        name: X-VA-First-Name
        required: true
        description: Veteran's first name
        example: Cara
        schema:
          $ref: '#/components/schemas/X-VA-First-Name'
      - in: header
        name: X-VA-Middle-Initial
        required: false
        description: Veteran's middle initial
        schema:
          $ref: '#/components/schemas/X-VA-Middle-Initial'
      - in: header
        name: X-VA-Last-Name
        required: true
        description: Veteran's last name
        example: Bartlett
        schema:
          $ref: '#/components/schemas/X-VA-Last-Name'
      - in: header
        name: X-VA-Birth-Date
        required: true
        description: Veteran's birth date
        example: '1975-02-14'
        schema:
          $ref: '#/components/schemas/X-VA-Birth-Date'
      - in: header
        name: X-Consumer-Username
        required: false
        description: Consumer User Name (passed from Kong)
        schema:
          type: string
      - in: header
        name: X-Consumer-ID
        required: false
        description: Consumer GUID
        schema:
          type: string
      responses:
        '200':
          description: Info about a single Notice of Disagreement
          content:
            application/json:
              examples:
                minimum fields used:
                  value:
                    data:
                      type: noticeOfDisagreementValidation
                      attributes:
                        status: valid
                all fields used:
                  value:
                    data:
                      type: noticeOfDisagreementValidation
                      attributes:
                        status: valid
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - noticeOfDisagreementValidation
                      attributes:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - valid
        '422':
          description: Error
          content:
            application/json:
              examples:
                Violates JSON schema:
                  value:
                    errors:
                    - title: Missing required fields
                      detail: One or more expected fields were not found
                      code: '145'
                      source:
                        pointer: /data/attributes
                      status: '422'
                      meta:
                        missing_fields:
                        - boardReviewOption
                Not JSON object:
                  value:
                    errors:
                    - code: '109'
                      detail: The request body isn't a JSON object
                      status: '422'
                      title: Validation error
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/nodCreate'
            examples:
              minimum fields used:
                value:
                  data:
                    type: noticeOfDisagreement
