                    type: noticeOfDisagreement
                    attributes:
                      veteran:
                        homeless: false
                        address:
                          addressLine1: 123 Main St
                          addressLine2: 'Suite #1200'
                          addressLine3: Box 4
                          city: North Pole
                          countryCodeISO2: CA
                          zipCode5: '00000'
