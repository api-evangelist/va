  /notice_of_disagreements/evidence_submissions:
    post:
      summary: Get a location for subsequent evidence submission document upload PUT request
      tags:
      - Notice of Disagreements
      operationId: postNoticeOfDisagreementEvidenceSubmission
      description: 'This is the first step to submitting supporting evidence for an NOD.  (See the Evidence Uploads section above for additional information.)

        The Notice of Disagreement GUID that is returned when the NOD is submitted, is supplied to this endpoint to ensure the NOD is in a valid state for sending supporting evidence documents.  Only NODs that selected the Evidence Submission lane are allowed to submit evidence documents up to 90 days after the NOD is received by VA.

        '
      parameters:
      - name: nod_uuid
        in: query
        required: true
        description: Associated Notice of Disagreement UUID
        example: 9dbc8f83-a778-417e-9f8b-a9a36d710f70
        schema:
          type: string
      - in: header
        name: X-VA-File-Number
        required: false
        description: Veteran's file number
        schema:
          $ref: '#/components/schemas/X-VA-File-Number'
      security:
      - apikey: []
      responses:
        '202':
          description: Accepted. Location generated
          content:
            application/json:
              example:
                data:
                  id: 55555555-6666-7777-8888-999999999999
                  type: evidenceSubmission
                  attributes:
                    status: pending
                    code: null
                    detail: null
                    location: http://some.fakesite.com/path/uuid
                    appealId: 00000000-1111-2222-3333-444444444444
                    finalStatus: false
                    appealType: NoticeOfDisagreement
                    createDate: '2020-01-02T03:04:05.067Z'
                    updateDate: '2020-01-02T03:04:05.067Z'
              schema:
                $ref: '#/components/schemas/nodEvidenceSubmissionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                errors:
                - code: '400'
                  detail: Must supply a corresponding NOD id in order to submit evidence
                  status: '400'
                  title: bad_request
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: Associated Notice of Disagreement not found
          content:
            application/json:
              example:
                errors:
                - title: not_found
                  detail: NoticeOfDisagreement with uuid 101010101010101010101010 not found
                  code: '404'
                  status: '404'
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Validation errors
          content:
            application/json:
              example:
                errors:
                - title: unprocessable_entity
                  detail: Corresponding Notice of Disagreement 'boardReviewOption' must be 'evidence_submission'
                  code: InvalidReviewOption
                  status: '422'
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
              schema:
                $ref: '#/components/schemas/errorModel'
