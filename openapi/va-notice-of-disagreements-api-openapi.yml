  /evidence-submissions:
    post:
      summary: Get a location for subsequent evidence submission document upload PUT request
      tags:
      - Notice of Disagreements
      operationId: postNoticeOfDisagreementEvidenceSubmission
      description: 'This is the first step to submitting supporting evidence for an NOD.  (See the Evidence Uploads section above for additional information.)

        The Notice of Disagreement GUID that is returned when the NOD is submitted, is supplied to this endpoint to ensure the NOD is in a valid state for sending supporting evidence documents.  Only NODs that selected the Evidence Submission lane are allowed to submit evidence documents up to 90 days after the NOD is received by VA.

        '
      security:
      - productionOauth:
        - veteran/NoticeOfDisagreements.write
        - representative/NoticeOfDisagreements.write
        - system/NoticeOfDisagreements.write
      - sandboxOauth:
        - veteran/NoticeOfDisagreements.write
        - representative/NoticeOfDisagreements.write
        - system/NoticeOfDisagreements.write
      - bearer_token: []
      parameters: []
      responses:
        '201':
          description: Location created
          content:
            application/json:
              example:
                data:
                  id: 55555555-6666-7777-8888-999999999999
                  type: evidenceSubmission
                  attributes:
                    status: pending
                    code: null
                    detail: null
                    location: http://path.to.upload/location/uuid
                    appealId: 00000000-1111-2222-3333-444444444444
                    finalStatus: false
                    appealType: NoticeOfDisagreement
                    createDate: '2020-01-02T03:04:05.067Z'
                    updateDate: '2020-01-02T03:04:05.067Z'
              schema:
                $ref: '#/components/schemas/nodEvidenceSubmissionResponse_2'
        '400':
          description: Bad request
          content:
            application/json:
              examples:
                Not JSON object:
                  value:
                    errors:
                    - code: '109'
                      detail: The request body isn't a JSON object
                      status: '400'
                      title: Bad Request
              schema:
                $ref: '#/components/schemas/errorModel'
        '403':
          description: Forbidden attempt using a veteran-scoped OAuth token to create an Evidence Submission for a Notice of Disagreement belonging to another Veteran
          content:
            application/json:
              example:
                errors:
                - title: Forbidden
                  detail: Veterans may access only their own records
                  code: '403'
                  status: '403'
              schema:
                $ref: '#/components/schemas/errorModel'
        '404':
          description: Associated Notice of Disagreement not found
          content:
            application/json:
              example:
                errors:
                - title: Resource not found
                  detail: Notice of Disagreement with uuid 00000000-0000-0000-0000-000000000000 not found
                  code: '404'
                  status: '404'
              schema:
                $ref: '#/components/schemas/errorModel'
        '422':
          description: Validation errors
          content:
            application/json:
              examples:
                Missing Notice of Disagreement ID:
                  value:
                    errors:
                    - title: Missing required fields
                      detail: One or more expected fields were not found
                      code: '145'
                      source:
                        pointer: /
                      status: '422'
                      meta:
                        missing_fields:
                        - nodId
                Missing File Number:
                  value:
                    errors:
                    - title: Missing required fields
                      detail: One or more expected fields were not found
                      code: '145'
                      source:
                        pointer: /
                      status: '422'
                      meta:
                        missing_fields:
                        - fileNumber
                Notice of Disagreement does not indicate an evidence submission:
                  value:
                    errors:
                    - title: unprocessable_entity
                      detail: Corresponding Notice of Disagreement 'boardReviewOption' must be 'evidence_submission'
                      code: InvalidReviewOption
                      status: '422'
              schema:
                $ref: '#/components/schemas/errorModel'
        '500':
          description: Internal Server Error
          content:
            application/json:
              example:
                errors:
                - title: Internal server error
                  detail: Internal server error
                  code: '500'
                  status: '500'
              schema:
                $ref: '#/components/schemas/errorModel'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#components/schemas/nodEvidenceSubmissionCreate'
