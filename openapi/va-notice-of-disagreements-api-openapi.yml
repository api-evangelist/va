    contestableIssue:
      type: object
      description: A contestable issue (to contest this, you include it as a RequestIssue when creating a HigherLevelReview, SupplementalClaim, or Appeal)
      properties:
        type:
          type: string
          enum:
          - contestableIssue
        id:
          type:
          - string
          - 'null'
        attributes:
          type: object
          properties:
            ratingIssueReferenceId:
              type:
              - string
              - 'null'
              description: RatingIssue ID
              example: '2385'
            ratingIssueProfileDate:
              type:
              - string
              - 'null'
              format: date
              description: (yyyy-mm-dd) RatingIssue profile date
              example: '2006-05-31'
            ratingIssueDiagnosticCode:
              type:
              - string
              - 'null'
              description: RatingIssue diagnostic code
              example: '5005'
            ratingDecisionReferenceId:
              type:
              - string
              - 'null'
              description: The BGS ID for the contested rating decision. This may be populated while ratingIssueReferenceId is nil
              example: null
            decisionIssueId:
              type:
              - integer
              - 'null'
              description: DecisionIssue ID
              example: null
            approxDecisionDate:
              type:
              - string
              - 'null'
              format: date
              description: (yyyy-mm-dd) Approximate decision date
              example: '2006-11-27'
            description:
              type:
              - string
              - 'null'
              description: Description
              example: Service connection for hypertension is granted with an evaluation of 10 percent effective July 24, 2005.
            rampClaimId:
              type:
              - string
              - 'null'
              description: RampClaim ID
              example: null
            titleOfActiveReview:
              type:
              - string
              - 'null'
              description: Title of DecisionReview that this issue is still active on
              example: null
            sourceReviewType:
              type:
              - string
              - 'null'
              description: The type of DecisionReview (HigherLevelReview, SupplementalClaim, Appeal) the issue was last decided on (if any)
              example: null
            timely:
              type: boolean
              description: An issue is timely if the receipt date is within 372 dates of the decision date.
              example: false
            activeReview:
              type: boolean
              description: Indicates whether this issue is already part of an active Decision Review that is being processed by VA. Submitting a Decision Review that includes a listed issue with an activeReview of true may result in VA rejecting the submission.
              example: false
            latestIssuesInChain:
              type: array
              description: Shows the chain of decision and rating issues that preceded this issue. Only the most recent issue can be contested (the object itself that contains the latestIssuesInChain attribute).
              items:
                type: object
                properties:
                  id:
                    oneOf:
                    - type:
                      - string
                      - 'null'
                    - type: integer
                    example: null
                  approxDecisionDate:
                    type:
                    - string
                    - 'null'
                    format: date
                    example: '2006-11-27'
            ratingIssueSubjectText:
              type:
              - string
              - 'null'
              description: Short description of RatingIssue
              example: Hypertension
            ratingIssuePercentNumber:
              type:
              - string
              - 'null'
              description: Numerical rating for RatingIssue
              example: '10'
            isRating:
              type: boolean
              description: Whether or not this is a RatingIssue
              example: true
    X-VA-NonVeteranClaimant-Middle-Initial:
      allOf:
      - description: middle initial
      - $ref: '#/components/schemas/nonBlankString'
    X-VA-NonVeteranClaimant-Last-Name:
      allOf:
      - description: last name
      - $ref: '#/components/schemas/nonBlankString'
    nodCreate:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum:
              - noticeOfDisagreement
            attributes:
              type: object
              properties:
                veteran:
                  type: object
                  properties:
                    homeless:
                      type: boolean
                    address:
                      $ref: '#/components/schemas/address'
                    phone:
                      allOf:
                      - $ref: '#/components/schemas/phone'
                      - $comment: the phone fields must not exceed 20 chars, when concatenated
                    email:
                      type: string
                      format: email
                      minLength: 6
                      maxLength: 255
                    timezone:
                      allOf:
                      - description: Veteran's timezone. Used for adding the current date to the signature according to the veteran's local time. If not specified, the current UTC date will be used for the signature (which may be ahead or behind the local date).
                      - $ref: '#/components/schemas/timezone'
                  required:
                  - homeless
                  - phone
                  - email
                  if:
                    properties:
                      homeless:
                        const: false
                  then:
                    required:
                    - address
                claimant:
                  type: object
                  description: If the claimant is a non-Veteran, claimant information is required. Without this information, we will be unable to identify the claimant. If you're a healthcare provider or an employee of a healthcare provider requesting review of a VA payment decision, you must identify the healthcare provider as the claimant and complete all relevant information in the claimant object.
                  properties:
                    homeless:
                      type: boolean
                    address:
                      $ref: '#/components/schemas/address'
                    phone:
                      allOf:
                      - $ref: '#/components/schemas/phone'
                      - $comment: the phone fields must not exceed 20 chars, when concatenated
                    email:
                      type: string
                      format: email
                      minLength: 6
                      maxLength: 255
                    timezone:
                      allOf:
                      - description: Claimant's timezone. Used for adding the current date to the signature according to the claimant's local time. If not specified, the current UTC date will be used for the signature (which may be ahead or behind the local date).
                      - $ref: '#/components/schemas/timezone'
                  required:
                  - homeless
                  - phone
                  - email
                  if:
                    properties:
                      homeless:
                        const: false
                  then:
                    required:
                    - address
                representative:
                  type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 120
                boardReviewOption:
                  type: string
                  enum:
                  - direct_review
                  - evidence_submission
                  - hearing
                hearingTypePreference:
                  type: string
                  enum:
                  - virtual_hearing
                  - video_conference
                  - central_office
                requestingExtension:
                  type: boolean
                  description: Set to true to request a filing extension. An extensionReason must be provided if true.
                extensionReason:
                  type: string
                  minLength: 1
                  maxLength: 2300
                  description: Explanation why you believe there is good cause for the extension. If an extensionReason is provided, requestingExtension must be true.
                appealingVhaDenial:
                  type: boolean
                  description: Set to true if you are appealing a denial of benefits by the Veterans Health Administration (VHA).
              required:
              - boardReviewOption
              if:
                properties:
                  requestingExtension:
                    const: true
              then:
                required:
                - extensionReason
          required:
          - type
          - attributes
        included:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - contestableIssue
                - appealableIssue
              attributes:
                type: object
                properties:
                  issue:
                    type: string
                    minLength: 1
                    maxLength: 180
                  decisionDate:
                    type: string
                    format: date
                  decisionIssueId:
                    type: integer
                  ratingIssueReferenceId:
                    type: string
                    minLength: 1
                    maxLength: 255
                  ratingDecisionReferenceId:
                    type: string
                    minLength: 1
                    maxLength: 255
                  disagreementArea:
                    type: string
                    maxLength: 90
                required:
                - issue
                - decisionDate
            required:
            - type
            - attributes
          minItems: 1
          maxItems: 100
          uniqueItems: true
      required:
      - data
      - included
    nodEvidenceSubmissionResponse_2:
      type: object
      properties:
        data:
          properties:
            id:
              description: The document upload identifier
              type: string
              format: uuid
              example: 6d8433c1-cd55-4c24-affd-f592287a7572
            type:
              description: JSON API type specification
              type: string
              example: evidenceSubmission
            attributes:
              properties:
                status:
                  type: string
                  example: received
                  enum:
                  - received
                  - processing
                  - success
                  - pending
                  - uploaded
                  - vbms
                  - error
                  - expired
                code:
                  type:
                  - string
                  - 'null'
                detail:
                  type:
                  - string
                  - 'null'
                  description: Human readable error detail. Only present if status = "error"
                appealType:
                  description: Type of associated appeal
                  type: string
                  example: NoticeOfDisagreement
                appealId:
                  description: GUID of associated appeal
                  type: string
                  format: uuid
                  example: 2926ad2a-9372-48cf-8ec1-69e08e4799ef
                location:
                  type:
                  - string
                  - 'null'
                  description: Location to which to PUT document Payload
                  format: uri
                  example: https://sandbox-api.va.gov/example_path_here/6d8433c1-cd55-4c24-affd-f592287a7572
                updateDate:
                  description: The last time the submission was updated
                  type: string
                  format: date-time
                  example: '2018-07-30T17:31:15.958Z'
                createDate:
                  description: The time the submission was created
                  type: string
                  format: date-time
                  example: '2018-07-30T17:31:15.958Z'
                finalStatus:
                  description: Indicates whether the status of the submission is final. Submissions with a finalStatus of true will no longer update to a new status.
                  type: boolean
                  example: false
          required:
          - id
          - type
          - attributes
      required:
      - data
