components:
  schemas:
    X-VA-ICN:
      description: Veteran's Integration Control Number, a unique identifier established via the Master Person Index (MPI)
      type: string
      minLength: 17
      maxLength: 17
      pattern: ^[0-9]{10}V[0-9]{6}$
    X-VA-Last-Name:
      allOf:
      - description: last name
      - $ref: '#/components/schemas/nonBlankString'
    nodCreateResponse:
      description: Successful response of a 10182 form submission
      type: object
      properties:
        data:
          properties:
            id:
              type: string
              description: Unique ID of created NOD
              example: 97751cb6-d06d-4179-87f6-75e3fc9d875c
            type:
              type: string
              description: Name of record class
              example: noticeOfDisagreement
            attributes:
              type: object
              properties:
                status:
                  type: string
                  description: Status of NOD
                  example: pending
                  enum:
                  - pending
                  - submitting
                  - submitted
                  - processing
                  - success
                  - complete
                  - error
                createdAt:
                  type: string
                  description: Created timestamp of the NOD
                  example: '2020-12-16T19:52:23.909Z'
                updatedAt:
                  type: string
                  description: Updated timestamp of the NOD
                  example: '2020-12-16T19:52:23.909Z'
            formData:
              $ref: '#/components/schemas/nodCreate'
        included:
          type: array
          items:
            $ref: '#/components/schemas/contestableIssue'
    nodShowResponse:
      type: object
      properties:
        data:
          properties:
            id:
              $ref: '#/components/schemas/uuid'
            type:
              type: string
              enum:
              - noticeOfDisagreement
            attributes:
              properties:
                status:
                  type: string
                  example: pending
                  enum:
                  - pending
                  - submitting
                  - submitted
                  - processing
                  - success
                  - complete
                  - error
                updatedAt:
                  description: The last time the submission was updated
                  type: string
                  format: date-time
                  example: '2018-07-30T17:31:15.958Z'
                createdAt:
                  description: The time the submission was created
                  type: string
                  format: date-time
                  example: '2018-07-30T17:31:15.958Z'
          required:
          - id
          - type
          - attributes
      required:
      - data
    errorModel:
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            additionalProperties: false
            required:
            - title
            properties:
              title:
                type: string
                description: HTTP error title
              detail:
                type: string
                description: HTTP error detail
              code:
                type: string
                description: HTTP error code
              source:
                type: object
                additionalProperties: false
                description: Source of error
                properties:
                  pointer:
                    type: string
                    description: Pointer to source of error
                  parameter:
                    type: string
                    description: Invalid request parameter
                  header:
                    type: string
                    description: Invalid header
              status:
                type: string
                description: HTTP error code
              meta:
                type: object
                description: Meta infomation
                properties:
                  missing_fields:
                    type: array
                    items:
                      type: string
                    description: List of missing fields
    X-VA-NonVeteranClaimant-First-Name:
      allOf:
      - description: first name
      - $ref: '#/components/schemas/nonBlankString'
    X-VA-Middle-Initial:
      allOf:
      - description: middle initial
      - $ref: '#/components/schemas/nonBlankString'
    X-VA-File-Number:
      allOf:
      - description: VA file number (c-file / css)
      - maxLength: 9
      - $ref: '#/components/schemas/nonBlankString'
    X-VA-Birth-Date:
      description: Veteran's birth date
      type: string
      format: date
    nodEvidenceSubmissionResponse:
      type: object
      properties:
        data:
          properties:
            id:
              description: The document upload identifier
              type: string
              format: uuid
              example: 6d8433c1-cd55-4c24-affd-f592287a7572
            type:
              description: JSON API type specification
              type: string
              example: evidenceSubmission
            attributes:
              properties:
                status:
                  type: string
                  example: received
                  enum:
                  - received
                  - processing
                  - success
                  - pending
                  - uploaded
                  - vbms
                  - error
                  - expired
