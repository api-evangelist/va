          description: Bad Request - source parameter is missing, unsupported (e.g. vista), or invalid
        '404':
          content:
            application/json:
              schema:
                $ref: ./schemas/Errors.yml
          description: Not Found - no note matching the given ID
        '502':
          content:
            application/json:
              schema:
                $ref: ./schemas/Errors.yml
          description: Bad Gateway - upstream service error
      summary: /v2/medical_records/clinical_notes/{id}
      tags:
      - Medical Records
components:
  parameters:
    InflectionHeader:
      in: header
      name: X-Key-Inflection
      required: false
      schema:
        type: string
        enum:
        - camel
        - snake
      description: Instructs the API to return camelCase keys rather than snake_case
  securitySchemes:
    CookieAuth:
      type: apiKey
      name: api_session
      in: cookie
      description: An authenticated session is established using the Sessions Controller to initiate federated authentication with an external credential provider, after which an API session token is established in the api_session cookie.
