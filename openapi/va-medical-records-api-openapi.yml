  /v2/medical_records/clinical_notes/{id}:
    get:
      description: 'Get a single clinical note by ID. The `source` query parameter is required and must be set

        to `oracle-health` to retrieve the note directly from the Oracle Health source-specific endpoint.

        Requests with `source=vista` or without a `source` parameter will receive a 404 response.

        '
      operationId: getClinicalNoteV2
      parameters:
      - name: id
        in: path
        description: Clinical note record ID
        required: true
        schema:
          type: string
      - name: source
        in: query
        description: 'The data source of the note. Must be `oracle-health` for direct retrieval from the Oracle Health endpoint. Requests with `vista` or without this parameter return 404.

          '
        required: true
        schema:
          type: string
          enum:
          - oracle-health
      - $ref: '#/components/parameters/InflectionHeader'
      responses:
        '200':
          description: Single clinical note response
          content:
            application/json:
              schema:
