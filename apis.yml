    email: api@va.gov
- name: Veteran Verification API
  description: >-
    Allows authorized third parties to verify a Veteran's service history, Veteran status, discharge information,
    and disability rating using OAuth 2.0 authorization from the Veteran.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/veteran-service-history-and-eligibility
  baseURL: https://api.va.gov/services/veteran_verification/v2
  tags:
  - Verification
