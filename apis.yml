  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: Direct Deposit Management API
  description: >-
    Enables accredited VSO representatives to view and update direct deposit information for Veterans
    receiving VA disability compensation and pension payments.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/direct-deposit-management
