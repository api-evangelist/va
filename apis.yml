  - Benefits
  - Verification
  properties:
  - type: Documentation
    url: https://developer.va.gov/explore/api/va-letter-generator/docs
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: Benefits Reference Data API
  description: >-
    Provides reference data used for VA benefits forms and applications, including lists of service branches,
    discharge types, disabilities, countries, and other standardized VA data sets.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/benefits-reference-data
