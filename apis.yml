  - type: Documentation
    url: https://developer.va.gov/explore/api/direct-deposit-management/docs
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: VA Letter Generator API
  description: >-
    Allows Veterans and authorized third parties to generate official VA letters confirming veteran status,
    service history, benefit summary, and other information required for housing, employment, and benefits
    purposes.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/va-letter-generator
  baseURL: https://api.va.gov/services/letter-generator/v0
  tags:
