apis:
- name: Patient Health API (FHIR)
  description: >-
    Allows Veterans and authorized third parties to access patient health data using the HL7 FHIR R4 standard,
    including records, medications, conditions, immunizations, and appointments from VA facilities.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/patient-health
  baseURL: https://api.va.gov/services/fhir/v0/r4
  tags:
  - Health
  - FHIR
  - Medical Records
  - R4
  properties:
  - type: Documentation
    url: https://developer.va.gov/explore/api/patient-health/docs
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: Health Care Costs and Coverage API (FHIR)
  description: >-
    Provides access to health care expense data for VA patients including medical charges, services received,
    and payments for health-related expenses using the FHIR standard.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/health-care-costs-coverage
  baseURL: https://api.va.gov/services/fhir/v0/r4
  tags:
  - Health
  - FHIR
  - Costs
  - Coverage
  properties:
  - type: Documentation
    url: https://developer.va.gov/explore/api/health-care-costs-coverage
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: Appeals Status API
  description: >-
    Enables authorized parties to request the status of a Veteran's benefits claim appeal, including the
    current step in the process, estimated decision dates, and hearing information.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/appeals-status
  baseURL: https://api.va.gov/services/appeals/v1
  tags:
  - Appeals
  - Benefits
  - Claims
  properties:
  - type: Documentation
    url: https://developer.va.gov/explore/api/appeals-status/docs
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: Decision Reviews API
  description: >-
    Allows accredited representatives and Veterans to interact with VA decision reviews (benefit appeals),
    including submitting Supplemental Claims, Higher-Level Reviews, and Board Appeals.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/decision-reviews
  baseURL: https://api.va.gov/services/appeals/v2
  tags:
  - Decision Reviews
  - Appeals
  - Benefits
  properties:
  - type: Documentation
    url: https://developer.va.gov/explore/api/decision-reviews/docs
  contact:
  - FN: VA API Platform Support
    email: api@va.gov
- name: VA Facilities API
  description: >-
    Provides location information and services data for VA facilities including VA Medical Centers, community-based
    outpatient clinics, Vet Centers, and benefits offices across the United States.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.va.gov/explore/api/va-facilities
  baseURL: https://api.va.gov/services/va_facilities/v1
  tags:
